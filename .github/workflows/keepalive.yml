name: Supabase keep-alive

# Supabase pauses free projects after ~7 days without activity.
# One read a day keeps it awake. The publishable key is public by design.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query sits table
        env:
          SB_URL: https://ogzvbiezyqoofjgautvx.supabase.co
          SB_KEY: sb_publishable_tWZmdcRPQAxlAkhwoD4DZw_smmD0WSz
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SB_URL/rest/v1/sits?select=id&limit=1" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          echo "HTTP $code"
          [ "$code" = "200" ]
